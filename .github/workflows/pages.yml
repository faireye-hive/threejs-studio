name: Publish Three.js Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download upstream editor (without importing its history)
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch dev https://github.com/mrdoob/three.js.git upstream
          git -C upstream sparse-checkout set editor build examples/jsm examples/fonts files
      - name: Assemble static site
        run: python3 scripts/build_site.py upstream public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
