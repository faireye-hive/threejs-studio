name: Publish Three.js Studio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download upstream editor (without importing its history)
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch dev https://github.com/mrdoob/three.js.git upstream
          git -C upstream sparse-checkout set editor build examples/jsm examples/fonts files
      - name: Check JavaScript and Python syntax
        run: |
          node --check server/index.mjs
          node --check studio/bridge.js
          node --check control/app.js
          python3 -m py_compile scripts/build_site.py
          node --test server/server.test.mjs
      - name: Assemble static site
        run: |
          python3 scripts/build_site.py upstream public
          test -f public/control/index.html
          test -f public/editor/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
